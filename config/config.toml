[ASSETS]
DATASET       = "resources"
SPLITS        = "config/splits.json"
MODEL_PY      = "artifacts/model-py.pt"
MODEL_CPP     = "artifacts/model-cpp.pt"

[PREPROCESSOR]
SIZE          = 660000
NUM_FFT       = 1024
HOP           = 512
NUM_MELS      = 128
NUM_MFCC      = 13

[MODEL]
BASE_URL      = "https://s3.mrgi23.com/artifacts/Music-Genres-Classification"
PACKAGE       = "model"
VERSION       = "1.0.0"

[SCHEDULER]
MODE          = "max"
FACTOR        = 0.5
PATIENCE      = 3

[TRAINER]
TYPE          = "Adam"
LR            = 1e-3
BATCH_SIZE    = 16
WORKERS       = 4
EPOCHS        = 120
