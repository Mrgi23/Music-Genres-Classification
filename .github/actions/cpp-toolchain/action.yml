name: Setup C++ toolchain

runs:
  using: "composite"

  steps:
    - shell: bash
      run: |
        set -euo pipefail
        UBUNTU_VER="$(lsb_release -rs | sed 's/\.//g')"
        wget -q "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu${UBUNTU_VER}/x86_64/cuda-keyring_1.1-1_all.deb"
        sudo dpkg -i cuda-keyring_1.1-1_all.deb

        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          cmake \
          cuda-runtime-12-8 \
          cuda-toolkit-12-8 \
          libcudnn9-cuda-12 \
          libcudnn9-dev-cuda-12 \
          gcc-12 \
          g++-12 \
          git \
          lcov \
          libaubio-dev \
          libarchive-dev \
          libcurl4-openssl-dev \
          liblapack-dev \
          libomp-dev \
          libopenblas-dev \
          ninja-build \
          pkg-config
        echo "/usr/local/cuda-12.8/bin" >> "$GITHUB_PATH"
        echo "LD_LIBRARY_PATH=/usr/local/cuda-12.8/lib64:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"